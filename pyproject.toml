[build-system]
requires = ["uv_build>=0.12.24,<0.14"]
build-backend = "uv_build"

[project]
name = "tclf"
version = "0.4.0"
authors = [{ name = "Markus Bilz", email = "github@markusbilz.com" }]
description = "Classify trades using trade classification algorithms 🐍"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  # array API: scikit-learn moves arrays across devices via numpy.from_dlpack(device=, copy=)
  "numpy >=2.1",
  "narwhals >=2.0",
  "scikit-learn >=1.8",
  # array API dispatch in scikit-learn requires scipy >= 1.14
  "scipy >=1.14",
]

[dependency-groups]
test = ["array-api-strict", "pandas", "pytest", "pytest-cov", "pytest-codspeed"]
docs = ["zensical", "mkdocstrings-python"]
dev = [
  { include-group = "test" },
  { include-group = "docs" },
  "prek",
  "ruff",
  "ty",
]

[project.urls]
"Homepage" = "https://github.com/KarelZe/tclf"
"Bug Tracker" = "https://github.com/KarelZe/tclf/issues"

[tool.ty.rules]
unresolved-import = "error"
unused-ignore-comment = "warn"
possibly-unresolved-reference = "error"
division-by-zero = "error"
redundant-cast = "error"
deprecated = "error"

[tool.pytest.ini_options]
minversion = 7.0
addopts = "-ra -p no:warnings -v --cov --cov-report term-missing --doctest-modules"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
omit = ["debug_*.py", "tests/*"]
branch = true

[tool.coverage.report]
exclude_also = [
  "def __repr__",
  "if self\\.debug",
  "raise AssertionError",
  "raise NotImplementedError",
  "if 0:",
  "if __name__ == .__main__.:",
  "@(abc\\.)?abstractmethod",
  "if self.verbose:",
]
show_missing = true

[tool.ruff]

[tool.ruff.lint]

# See rules: https://beta.ruff.rs/docs/rules/
select = [
  "C",    # flake8-comprehensions
  "D",    # pydocstyle
  "DOC",  # pydoclint
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "FURB", # refurb
  "I",    # isort
  "N",    # pep8-naming
  "NPY",  # numpy
  "PD",   # pandas-vet
  "PIE",  # misc lints
  "PT",   # pytest
  "PTH",  # flake8-use-pathlib
  "PGH",  # pygrep
  "RET",  # return
  "RUF",  # ruff-specific rules
  "UP",   # pyupgrade
  "SIM",  # flake8-simplify
  "W",    # pycodestyle warnings
]

ignore = [
  "line-too-long",                      # line too long, handled by black
  "invalid-argument-name",              # argument name should be lowercase
  "non-lowercase-variable-in-function", # variable name should be lowercase
  "complex-structure",                  # too complex
  "docstring-tab-indentation",          # indent with white space
  "tab-indentation",                    # tab identation
]

preview = true

[tool.ruff.format]
preview = true

[tool.ruff.lint.isort]
known-first-party = ["tclf"]
section-order = [
  "future",
  "standard-library",
  "third-party",
  "first-party",
  "local-folder",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
  "undocumented-public-package",
  "unused-import",
] # disable missing docstrings in __init__, unused imports

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.uv]
exclude-newer = "7 days"
