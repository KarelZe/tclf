# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "check-added-large-files" },
  { id = "fix-byte-order-marker" },
  { id = "check-merge-conflict" },
  { id = "check-symlinks" },
  { id = "check-toml" },
  { id = "check-yaml", args = [
    "--unsafe",
  ] },
  { id = "end-of-file-fixer" },
  { id = "mixed-line-ending" },
]

# Python-specific hooks without a prek builtin equivalent.
[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [{ id = "check-builtin-literals" }, { id = "debug-statements" }]

[[repos]]
repo = "local"
hooks = [
  { id = "ty", name = "ty", entry = "ty check .", language = "system", types = [
    "python",
  ], pass_filenames = true },
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.17.1"
hooks = [{ id = "ruff-check", args = ["--fix"] }, { id = "ruff-format" }]

[[repos]]
repo = "https://github.com/ComPWA/taplo-pre-commit"
rev = "v0.9.3"
hooks = [{ id = "taplo-format" }]
