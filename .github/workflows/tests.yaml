name: Tests
permissions:
  contents: read
on:
  push:
    paths:
      - '**/*'
      - '!docs/**'
jobs:
  build:
    name: test with ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version:
          - "3.10"
          - "3.11"
        os: [ubuntu-latest]
    steps:
    - name: Git clone
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install uv and python
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        enable-cache: true
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
            uvx --with tox-uv tox -e test
    - name: Upload Coverage to Codecov
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        env_vars: OS,PYTHON
        fail_ci_if_error: true
        verbose: true
    - name: Run benchmarks
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      uses: CodSpeedHQ/action@88472375d0a4572cf70a9f1fe3a4e0ab8da1b924 # v5.0.1
      with:
        mode: simulation
        token: ${{ secrets.CODSPEED_TOKEN }}
        run: uv run --extra dev pytest tests/ -m benchmark --codspeed --no-cov
