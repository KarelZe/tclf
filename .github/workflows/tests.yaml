name: Tests
permissions:
  contents: read
on:
  push:
    paths:
      - '**/*'
      - '!docs/**'
jobs:
  build:
    name: test with ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version:
          - "3.10"
          - "3.11"
        os: [ubuntu-latest]
    steps:
    - name: Git clone
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install uv and python
      uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
      with:
        enable-cache: true
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: uv sync --frozen --no-build --no-default-groups --group test
    - name: Run pytest
      run: uv run --frozen --no-sync --no-build pytest -v tests --cov=src --cov-report=xml
    - name: Upload Coverage to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        env_vars: OS,PYTHON
        fail_ci_if_error: true
        verbose: true
    - name: Run benchmarks
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      uses: CodSpeedHQ/action@821a40cd6c80e3cfe387caf55668287addd808da # v5.5.0
      with:
        mode: simulation
        token: ${{ secrets.CODSPEED_TOKEN }}
        run: uv run --frozen --no-sync --no-build pytest tests/ -m benchmark --codspeed --no-cov
